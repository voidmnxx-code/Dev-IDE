name: CI

on:
  push:
  pull_request:

jobs:
  rust-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace

  android-apk:
    runs-on: ubuntu-latest
    needs: rust-core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Build debug APK (builds the Rust core + UniFFI bindings first)
        run: |
          # The runner's own NDK path; expression contexts can't read it.
          export ANDROID_NDK_HOME="${ANDROID_NDK_ROOT:-$ANDROID_NDK_LATEST_HOME}"
          test -d "$ANDROID_NDK_HOME" || { echo "NDK not found"; exit 1; }
          echo "Using NDK at $ANDROID_NDK_HOME"
          ./gradlew assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: dev-ide-debug-apks
          path: app/build/outputs/apk/**/debug/*.apk
