name: Build language packs

# Builds the offline toolchain packages (relocated Termux packages) and publishes them,
# together with catalog.json, as assets of the "packs" release.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  packs:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Build packages
        run: |
          python3 tools/packs/build_packs.py dist \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/packs"
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view packs >/dev/null 2>&1 || gh release create packs \
            --title "Language packs" --notes "Offline toolchain packages and catalog.json (built by the Build language packs workflow)."
          # Upload in batches; --clobber replaces assets of a previous run.
          ls dist | xargs -n 20 sh -c 'gh release upload packs --clobber $(for f in "$@"; do printf "dist/%s " "$f"; done)' _
