[package]
name = "ide_core"
version = "0.1.0"
edition = "2021"
description = "Dev-IDE native core: text buffer, workspace and file operations exposed to Kotlin via UniFFI"

[lib]
crate-type = ["cdylib", "lib"]
name = "ide_core"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
ropey = "1.6"
thiserror = "2"
uniffi = { version = "0.29", features = ["cli"] }
portable-pty = "0.9"
gix = { version = "0.91", default-features = false, features = ["sha1", "status", "revision", "index"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
tree-sitter = "0.27"
tree-sitter-highlight = "0.27"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-json = "0.24"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-html = "0.23"
tree-sitter-css = "0.25"
tree-sitter-bash = "0.25"
tree-sitter-toml-ng = "0.7"

[dev-dependencies]
tempfile = "3"
